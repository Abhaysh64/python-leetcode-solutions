name: Sync LeetCode Solutions

on:
  schedule:
    - cron: '0 0,12 * * *'  # runs at midnight and noon UTC
  workflow_dispatch:       # allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-slugify

      - name: Run LeetCode sync script
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
        run: python scripts/sync.py

      - name: Commit and push changes
        run: |
          git config --global user.name "leetcode-sync-bot"
          git config --global user.email "bot@leetcode-sync"
          git add .
          git diff --cached --quiet || git commit -m "sync: add new LeetCode solutions"
          git push
